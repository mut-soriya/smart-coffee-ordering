<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Smart Coffee — Touchless Kiosk</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');

    :root {
      --gesture-bar-height: calc(58px + env(safe-area-inset-bottom, 0px));
      --detail-bottom-gap: clamp(96px, 12dvh, 112px);
      --bg: #0d0907;
      --panel: #140d09;
      --panel2: #18100b;
      --panel3: #21170f;
      --cream: #fffaf4;
      --muted: rgba(255, 255, 255, .68);
      --muted2: rgba(255, 255, 255, .44);
      --coffee: #9b6b36;
      --caramel: #d6a15d;
      --gold: #f3c982;
      --line: rgba(255, 255, 255, .1);
      --line2: rgba(214, 161, 93, .34);
      --ok: #78c897;
      --danger: #e87979;
      --blue: #7ca9e8;
      --glass-bg: rgba(255, 255, 255, .055);
      --glass-hover: rgba(255, 255, 255, .085);
      --glass-border-hover: rgba(255, 255, 255, .18);
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --shadow: 0 12px 40px rgba(0, 0, 0, .25);
      --shadow-floating: 0 20px 60px rgba(0, 0, 0, .35);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0, #332116 0, #100b08 42%, #070605 100%);
      font-family: 'DM Sans', system-ui, sans-serif;
      color: var(--cream);
      cursor: none
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      cursor: none
    }

    .hidden {
      display: none !important
    }

    #app {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: 0
    }

    #kiosk {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(25, 19, 15, .97), rgba(9, 8, 7, .98));
      isolation: isolate
    }

    #kiosk:before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 78% 18%, rgba(214, 160, 96, .12), transparent 28%), radial-gradient(circle at 18% 90%, rgba(140, 87, 53, .1), transparent 32%);
      pointer-events: none
    }

    #kiosk:after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, .018) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .018) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
      pointer-events: none;
      z-index: -1
    }

    .brandmark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #e6b273, #8c5735);
      color: #1a0f09;
      box-shadow: 0 10px 30px rgba(214, 160, 96, .2);
      font-size: 22px
    }

    .status {
      height: 42px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .035);
      border-radius: 15px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .03em
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 12px currentColor
    }

    .status.wait .dot {
      background: var(--gold)
    }

    .status.err .dot {
      background: var(--danger)
    }

    .kiosk-status {
      position: absolute;
      top: 18px;
      right: 24px;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 9px
    }

    .vision-status {
      border-color: var(--line2);
      color: var(--gold);
      letter-spacing: .08em
    }

    .vision-status .dot {
      background: var(--ok)
    }

    .camera-preview {
      position: absolute;
      z-index: 80;
      width: clamp(190px, 21vw, 280px);
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border: 1px solid rgba(243, 201, 130, .55);
      border-radius: 18px;
      background: rgba(12, 9, 7, .94);
      box-shadow: 0 16px 38px rgba(0, 0, 0, .48);
      transition: top .35s ease, right .35s ease, bottom .35s ease, left .35s ease, transform .2s ease;
    }

    .camera-preview:hover {
      transform: scale(1.035);
      border-color: var(--gold);
    }

    .camera-preview[data-corner="top-left"] {
      top: 76px;
      left: 24px;
    }

    .camera-preview[data-corner="top-right"] {
      top: 76px;
      right: 24px;
    }

    .camera-preview[data-corner="bottom-left"] {
      bottom: calc(var(--gesture-bar-height) + 14px);
      left: 24px;
    }

    .camera-preview[data-corner="bottom-right"] {
      right: 24px;
      bottom: calc(var(--gesture-bar-height) + 14px);
    }

    .camera-preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-preview-label {
      position: absolute;
      top: 8px;
      left: 9px;
      z-index: 1;
      padding: 5px 8px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 8px;
      background: rgba(12, 9, 7, .76);
      color: var(--cream);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .1em;
      pointer-events: none;
    }

    .camera-preview-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      pointer-events: none;
    }

    .camera-preview img[data-ready="true"] + .camera-preview-fallback {
      display: none;
    }

    .camera-preview img[data-error="true"] {
      display: none;
    }

    @media (max-width: 600px) {
      .camera-preview {
        width: 150px;
      }

      .camera-preview[data-corner="top-left"],
      .camera-preview[data-corner="bottom-left"] {
        left: 12px;
      }

      .camera-preview[data-corner="top-right"],
      .camera-preview[data-corner="bottom-right"] {
        right: 12px;
      }
    }

    .floating-cart {
      position: absolute;
      top: 18px;
      left: 28px;
      z-index: 100;
      min-height: 46px;
      padding: 0 20px;
      border: 1px solid rgba(228, 181, 124, .45);
      border-radius: 18px;
      background: linear-gradient(135deg, #f0c88d, #b87943 58%, #8d562f);
      color: #1a0e08;
      box-shadow: 0 16px 36px rgba(0, 0, 0, .38);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: transform .2s ease, box-shadow .2s ease;
      cursor: pointer;
    }

    .floating-cart:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .46)
    }

    .floating-cart b {
      color: var(--gold)
    }

    #content {
      height: calc(100% - var(--gesture-bar-height));
      position: relative;
      overflow: hidden
    }

    .screen {
      height: 100%;
      padding: 34px 48px;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
      overscroll-behavior: contain;
      touch-action: pan-y;
      animation: screenIn .32s ease both
    }

    .screen:not(.menu-screen) {
      padding-top: 82px
    }

    .screen::-webkit-scrollbar {
      display: none
    }

    .screen.menu-screen {
      padding: 86px clamp(24px, 5vw, 76px) 96px
    }

    .detail-screen {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-screen > .toolbar {
      flex: 0 0 auto;
      margin-bottom: 16px;
    }

    .menu-brand {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 0 0 26px
    }

    .menu-brand .brandmark {
      width: 58px;
      height: 58px;
      border-radius: 19px;
      font-size: 30px
    }

    .menu-brand h1 {
      font: 800 clamp(30px, 4vw, 48px)/1.05 'Plus Jakarta Sans';
      letter-spacing: -.045em;
      margin: 0
    }

    .menu-brand p {
      color: var(--muted);
      margin: 5px 0 0;
      letter-spacing: .04em
    }

    .menu-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px
    }

    .search-wrap {
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 560px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .035);
      color: var(--muted)
    }

    .search-wrap input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--cream);
      font: inherit;
      cursor: text
    }

    .search-wrap input::placeholder {
      color: var(--muted2)
    }

    .category-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 2px 2px 12px;
      scrollbar-width: none
    }

    .category-strip::-webkit-scrollbar {
      display: none
    }

    .category-pill {
      min-height: 44px;
      flex: 0 0 auto;
      padding: 0 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .035);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: .18s
    }

    .category-pill:hover,
    .category-pill.active {
      color: #1a0e08;
      border-color: transparent;
      background: linear-gradient(135deg, #e5b16f, #b87943)
    }

    .menu-section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin: 15px 0 17px
    }

    .menu-section-heading h2 {
      margin: 0
    }

    .menu-result-count {
      color: var(--muted);
      font-size: 12px
    }

    .floating-cart b {
      color: #1a0e08;
      min-width: 22px;
      height: 22px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, .5)
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .footer {
      height: var(--gesture-bar-height);
      min-height: 58px;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      flex: 0 0 var(--gesture-bar-height);
      border-top: 1px solid var(--line);
      background: rgba(8, 7, 6, .65);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .03em;
      position: relative;
      z-index: 4
    }

    .footer strong {
      color: var(--gold);
      margin-right: 8px
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase
    }

    .eyebrow i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 14px var(--gold)
    }

    h2 {
      font: 800 clamp(28px, 3vw, 46px) 'Plus Jakarta Sans';
      margin: 9px 0 8px;
      letter-spacing: -.04em
    }

    h3 {
      font: 700 20px 'Plus Jakarta Sans';
      margin: 0
    }

    .lead {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65
    }

    .muted {
      color: var(--muted)
    }

    .btn {
      min-height: 58px;
      padding: 0 24px;
      border-radius: 17px;
      background: linear-gradient(135deg, #e5b16f, #b87943);
      color: #1a0e08;
      font-weight: 800;
      box-shadow: 0 14px 32px rgba(214, 160, 96, .16);
      transition: .18s;
      position: relative;
      overflow: hidden
    }

    .btn:before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent, rgba(255, 255, 255, .22), transparent);
      transform: translateX(-120%);
      transition: .45s
    }

    .btn:hover:before {
      transform: translateX(120%)
    }

    .btn.secondary {
      background: rgba(255, 255, 255, .045);
      border: 1px solid var(--line);
      color: var(--cream);
      box-shadow: none
    }

    .btn.dark {
      background: #241a14;
      color: var(--cream);
      border: 1px solid var(--line2)
    }

    .btn.danger {
      background: rgba(231, 123, 112, .09);
      border: 1px solid rgba(231, 123, 112, .25);
      color: #ff9c91
    }

    .btn.hold {
      background: linear-gradient(135deg, #3b2518, #1d130e);
      border: 1px solid var(--line2);
      color: var(--cream);
      overflow: hidden
    }

    .btn.hold .progress {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: linear-gradient(90deg, rgba(214, 160, 96, .18), rgba(214, 160, 96, .42));
      transition: width .08s
    }

    .btn.hold span {
      position: relative
    }

    .btn:disabled {
      opacity: .4
    }

    .hero {
      height: 100%;
      display: grid;
      grid-template-columns: 1.02fr .98fr;
      gap: 50px;
      align-items: center
    }

    .hero-copy {
      padding-left: 20px
    }

    .hero-title {
      font: 800 clamp(48px, 6vw, 84px)/.94 'Plus Jakarta Sans';
      letter-spacing: -.07em;
      margin: 16px 0 22px
    }

    .hero-title span {
      color: var(--gold)
    }

    .hero-copy .lead {
      max-width: 560px;
      font-size: 17px
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      margin-top: 30px
    }

    .micro {
      display: flex;
      gap: 18px;
      align-items: center;
      margin-top: 25px;
      color: var(--muted);
      font-size: 11px
    }

    .micro span {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .micro b {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold)
    }

    .hero-art {
      height: 100%;
      display: grid;
      place-items: center;
      position: relative
    }

    .halo {
      position: absolute;
      width: 430px;
      height: 430px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(214, 160, 96, .18), rgba(214, 160, 96, .04) 48%, transparent 70%);
      filter: blur(2px)
    }

    .coffee-orb {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle at 32% 24%, #f3d4a5 0 7%, #c88850 8% 17%, #6c3d23 35%, #2a170e 68%, #0c0806 100%);
      box-shadow: inset -30px -35px 55px rgba(0, 0, 0, .55), inset 25px 25px 45px rgba(255, 220, 170, .2), 0 40px 80px rgba(0, 0, 0, .55)
    }

    .coffee-orb:before {
      content: "";
      position: absolute;
      width: 190px;
      height: 68px;
      left: 85px;
      top: 128px;
      border-radius: 50%;
      background: radial-gradient(ellipse, #dcb17c 0 13%, #8a5533 16% 40%, #3b2113 42% 100%);
      box-shadow: 0 8px 25px rgba(0, 0, 0, .45)
    }

    .steam {
      position: absolute;
      top: 62px;
      left: 142px;
      width: 80px;
      height: 75px
    }

    .steam:before,
    .steam:after {
      content: "";
      position: absolute;
      width: 2px;
      height: 58px;
      border-radius: 100%;
      background: linear-gradient(transparent, rgba(255, 255, 255, .65), transparent);
      transform: rotate(8deg);
      animation: steam 2.4s infinite
    }

    .steam:after {
      left: 30px;
      animation-delay: .8s
    }

    @keyframes steam {

      0%,
      100% {
        transform: translateY(8px) rotate(8deg);
        opacity: 0
      }

      35% {
        opacity: .8
      }

      70% {
        transform: translateY(-8px) rotate(-8deg);
        opacity: 0
      }
    }

    .float-card {
      position: absolute;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: rgba(18, 15, 12, .72);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
      font-size: 11px;
      color: var(--muted);
      animation: float 4s ease-in-out infinite
    }

    .float-card strong {
      display: block;
      color: var(--cream);
      font-size: 12px;
      margin-bottom: 4px
    }

    .fc1 {
      top: 12%;
      right: 3%
    }

    .fc2 {
      bottom: 18%;
      left: 4%;
      animation-delay: 1.2s
    }

    .fc3 {
      bottom: 8%;
      right: 10%;
      animation-delay: 2s
    }

    @keyframes float {
      50% {
        transform: translateY(-8px)
      }
    }

    .toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 22px
    }

    .back {
      height: 42px;
      padding: 0 14px;
      border-radius: 13px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted)
    }

    .back:hover {
      color: var(--cream);
      border-color: var(--line2)
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 28px
    }

    .category {
      min-height: 300px;
      border: 1px solid var(--line);
      background: linear-gradient(150deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .018));
      border-radius: 25px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      text-align: left;
      transition: .2s
    }

    .category:after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -40px;
      bottom: -50px;
      border-radius: 50%;
      background: rgba(214, 160, 96, .1);
      filter: blur(15px)
    }

    .category:hover,
    .category.active {
      transform: translateY(-5px);
      border-color: var(--line2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .28)
    }

    .category .icon {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 35px;
      background: linear-gradient(145deg, rgba(214, 160, 96, .2), rgba(214, 160, 96, .04));
      border: 1px solid var(--line2);
      margin-bottom: 60px
    }

    .category p {
      color: var(--muted);
      font-size: 13px
    }

    .arrow {
      position: absolute;
      right: 22px;
      bottom: 22px;
      color: var(--gold);
      font-size: 20px
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 17px
    }

    .product {
      height: 360px;
      border: 1px solid var(--line);
      border-radius: 25px;
      background: linear-gradient(160deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .018));
      padding: 14px;
      position: relative;
      overflow: hidden;
      text-align: left;
      transition: .2s
    }

    .product:hover,
    .product.active {
      transform: translateY(-5px);
      border-color: var(--line2);
      box-shadow: 0 22px 55px rgba(0, 0, 0, .3)
    }

    .product.off {
      opacity: .48;
      filter: saturate(.4)
    }

    .product-visual {
      height: 200px;
      border-radius: 19px;
      background: radial-gradient(circle at 50% 32%, rgba(242, 209, 165, .22), transparent 42%), linear-gradient(145deg, #2b1a11, #110b08);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden
    }

    .cup {
      width: 116px;
      height: 92px;
      border-radius: 0 0 46px 46px;
      background: linear-gradient(145deg, #f0dfcc, #a87a58);
      position: relative;
      box-shadow: 0 24px 35px rgba(0, 0, 0, .4)
    }

    .cup:before {
      content: "";
      position: absolute;
      left: 7px;
      right: 7px;
      top: -14px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 55%, #c27d46 0 32%, #4b2818 34% 67%, #e0c2a0 69% 100%)
    }

    .cup:after {
      content: "";
      position: absolute;
      right: -29px;
      top: 17px;
      width: 38px;
      height: 45px;
      border: 9px solid #b88a69;
      border-left: 0;
      border-radius: 0 22px 22px 0
    }

    .product-visual .tag {
      position: absolute;
      top: 12px;
      left: 12px
    }

    .tag {
      padding: 6px 9px;
      border-radius: 9px;
      background: rgba(8, 7, 6, .68);
      border: 1px solid var(--line);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .12em;
      color: var(--gold)
    }

    .product-info {
      padding: 16px 4px
    }

    .product-name {
      font: 700 18px 'Plus Jakarta Sans'
    }

    .product-desc {
      height: 36px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      margin-top: 5px
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px
    }

    .price {
      font-weight: 800;
      color: var(--cream);
      font-size: 18px
    }

    .avail {
      font-size: 9px;
      font-weight: 800;
      color: var(--ok);
      letter-spacing: .1em
    }

    .avail.off {
      color: var(--danger)
    }

    .detail-layout {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 35px;
    }

    .detail-art {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: radial-gradient(circle at 50% 30%, rgba(214, 160, 96, .16), transparent 45%), linear-gradient(150deg, #1a120d, #0b0806);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden
    }

    .detail-art .cup {
      transform: scale(1.55)
    }

    .detail-copy {
      min-height: 0;
      height: auto;
      max-height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      touch-action: pan-y;
      scrollbar-width: thin;
      scrollbar-color: var(--coffee) rgba(255, 255, 255, .05);
      padding: 4px 14px calc(var(--detail-bottom-gap) + env(safe-area-inset-bottom, 0px)) 10px;
      scroll-padding-block-end: calc(var(--detail-bottom-gap) + env(safe-area-inset-bottom, 0px));
    }

    .detail-copy::-webkit-scrollbar {
      width: 8px;
    }

    .detail-copy::-webkit-scrollbar-track {
      border-radius: 8px;
      background: rgba(255, 255, 255, .04);
    }

    .detail-copy::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 8px;
      background: rgba(214, 160, 96, .58);
      background-clip: padding-box;
    }

    .detail-copy::-webkit-scrollbar-thumb:hover {
      background: rgba(240, 196, 124, .8);
      background-clip: padding-box;
    }

    .option-section {
      margin: 18px 0
    }

    .option-title {
      font-size: 10px;
      color: var(--muted);
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
      margin-bottom: 9px
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .option {
      padding: 11px 15px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .035);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      transition: .15s
    }

    .option.active,
    .option:hover {
      background: rgba(214, 160, 96, .12);
      border-color: var(--line2);
      color: var(--cream)
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 13px
    }

    .qbtn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--line);
      font-size: 20px
    }

    .qnum {
      font-weight: 800;
      min-width: 30px;
      text-align: center
    }

    .detail-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 20px;
      padding: 18px 0 8px;
      border-top: 1px solid var(--line)
    }

    .detail-footer > div:last-child {
      flex: 1 1 180px;
    }

    .detail-footer .add-to-cart {
      width: 100%;
      min-height: 58px;
    }

    .cart-layout {
      height: 100%;
      display: grid;
      grid-template-columns: 1.35fr .65fr;
      gap: 22px
    }

    .cart-list {
      overflow: auto;
      padding-right: 5px
    }

    .cart-item {
      display: grid;
      grid-template-columns: 72px 1fr auto auto;
      gap: 16px;
      align-items: center;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, .03);
      margin-bottom: 10px
    }

    .mini-cup {
      width: 70px;
      height: 70px;
      border-radius: 17px;
      background: linear-gradient(145deg, #2b1a11, #110b08);
      display: grid;
      place-items: center
    }

    .mini-cup .cup {
      transform: scale(.48)
    }

    .cart-name {
      font-weight: 800
    }

    .cart-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px
    }

    .summary {
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 22px;
      background: linear-gradient(160deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .02));
      height: max-content
    }

    .sumrow {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      margin: 10px 0
    }

    .sumtotal {
      display: flex;
      justify-content: space-between;
      padding-top: 16px;
      margin-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 20px;
      font-weight: 800
    }

    .summary .btn {
      width: 100%;
      margin-top: 12px
    }

    .review-grid {
      display: grid;
      grid-template-columns: 1fr .75fr;
      gap: 22px;
      height: 100%
    }

    .review-card,
    .ticket {
      border: 1px solid var(--line);
      border-radius: 26px;
      background: rgba(255, 255, 255, .035);
      padding: 22px
    }

    .review-items {
      max-height: 410px;
      overflow: auto
    }

    .review-line {
      display: flex;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid var(--line)
    }

    .confirm-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 1px solid var(--line2);
      border-radius: 26px;
      background: radial-gradient(circle at 50% 30%, rgba(214, 160, 96, .12), transparent 50%), rgba(255, 255, 255, .025);
      padding: 28px
    }

    .hold-ring {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid var(--line2);
      background: rgba(214, 160, 96, .06);
      margin-bottom: 20px;
      position: relative
    }

    .hold-ring:before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px dashed rgba(214, 160, 96, .3);
      border-radius: 50%;
      animation: spin 8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .success {
      height: 100%;
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 30px;
      align-items: center
    }

    .success-mark {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: auto;
      background: radial-gradient(circle, rgba(99, 197, 138, .28), rgba(99, 197, 138, .04));
      border: 1px solid rgba(99, 197, 138, .35);
      box-shadow: 0 0 70px rgba(99, 197, 138, .1);
      font-size: 75px;
      color: var(--ok)
    }

    .order-id {
      font: 800 54px 'Plus Jakarta Sans';
      color: var(--gold);
      letter-spacing: -.05em
    }

    .ticket {
      max-width: 480px;
      background: #f7efe5;
      color: #20150f;
      box-shadow: 0 25px 70px rgba(0, 0, 0, .35)
    }

    .ticket .muted {
      color: #75685f
    }

    .ticket hr {
      border: 0;
      border-top: 1px dashed #bcae9f;
      margin: 15px 0
    }

    .ticket-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin: 9px 0
    }

    .ticket-total {
      font-size: 20px;
      font-weight: 800
    }

    .error-wrap,
    .empty {
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center
    }

    .error-card {
      width: min(580px, 90%);
      padding: 42px;
      border: 1px solid rgba(231, 123, 112, .25);
      border-radius: 30px;
      background: rgba(231, 123, 112, .045)
    }

    .error-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: rgba(231, 123, 112, .1);
      color: #ff9c91;
      font-size: 36px
    }

    .empty-icon {
      font-size: 60px;
      opacity: .7
    }

    #cursor {
      position: fixed;
      left: 0;
      top: 0;
      width: 52px;
      height: 52px;
      transform: translate(-50%, -50%);
      z-index: 9999;
      pointer-events: none;
      will-change: transform;
    }

    #cursor,
    #cursor * {
      pointer-events: none !important;
    }

    #cursor.inactive {
      opacity: 0;
    }

    .cursor-ring {
      position: absolute;
      inset: 0;
      border: 2px solid var(--gold);
      border-radius: 50%;
      background: rgba(214, 160, 96, .08);
      box-shadow: 0 0 28px rgba(214, 160, 96, .3);
      transition: .15s
    }

    .cursor-dot {
      position: absolute;
      left: 21px;
      top: 21px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cream);
      box-shadow: 0 0 12px rgba(255, 255, 255, .7)
    }

    #cursor.hover .cursor-ring {
      transform: scale(1.22);
      background: rgba(214, 160, 96, .15);
      box-shadow: 0 0 36px rgba(214, 160, 96, .48)
    }

    #cursor.scrolling .cursor-ring {
      transform: scale(.82) rotate(45deg);
      border-color: #7ca9e8;
      background: rgba(124, 169, 232, .14);
      box-shadow: 0 0 36px rgba(124, 169, 232, .34)
    }

    #cursor.scrolling .cursor-dot {
      background: #cfe3ff
    }

    #cursor.scrolling .cursor-label {
      opacity: 1;
      border-color: rgba(124, 169, 232, .4);
      color: #cfe3ff;
    }

    #cursor.pinch .cursor-ring {
      transform: scale(.72);
      background: rgba(214, 160, 96, .3)
    }

    #cursor .cursor-label {
      position: absolute;
      top: 61px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      background: #15100c;
      color: var(--gold);
      border: 1px solid var(--line2);
      border-radius: 9px;
      padding: 5px 8px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .08em;
      opacity: 0;
      transition: .15s
    }

    #cursor.hover .cursor-label {
      opacity: 1
    }

    #cursor.dragging .cursor-ring {
      border-color: var(--gold);
      background: rgba(243, 201, 130, .18);
      box-shadow: 0 0 28px rgba(214, 161, 93, .42);
    }

    #cursor.dragging .cursor-dot {
      background: var(--gold);
    }

    .drag-preview {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9998;
      display: none;
      width: min(190px, 42vw);
      min-height: 86px;
      padding: 9px;
      border: 1px solid rgba(214, 161, 93, .5);
      border-radius: 18px;
      background: rgba(255, 255, 255, .08);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
      pointer-events: none;
      will-change: transform, opacity;
      transition: none;
    }

    .drag-preview.visible {
      display: block;
      animation: productLift .2s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes productLift {
      from { opacity: .55; scale: .92; }
      to { opacity: 1; scale: 1; }
    }

    .drag-preview-card {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }

    .drag-preview-photo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      object-fit: cover;
      background: #21170f;
    }

    .drag-preview-name {
      overflow: hidden;
      color: var(--cream);
      font-size: 12px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .drag-preview-category {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .drag-preview-price {
      margin-top: 4px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
    }

    .drag-preview-state {
      display: block;
      margin-bottom: 7px;
      color: var(--gold);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .floating-cart {
      position: absolute;
      overflow: visible;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .floating-cart .drop-hint {
      display: none;
      position: absolute;
      left: 50%;
      bottom: calc(100% + 7px);
      padding: 6px 10px;
      border: 1px solid rgba(243, 201, 130, .36);
      border-radius: 999px;
      background: rgba(24, 17, 12, .9);
      color: var(--gold);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .1em;
      white-space: nowrap;
      transform: translateX(-50%);
    }

    .floating-cart.drop-target {
      transform: scale(1.06);
      filter: brightness(1.08);
      box-shadow: 0 0 35px rgba(214, 161, 93, .24), var(--shadow-floating);
    }

    .floating-cart.drop-target .drop-hint {
      display: block;
    }

    .floating-cart.drag-active {
      right: 24px;
      bottom: calc(var(--gesture-bar-height) + 22px);
      width: min(300px, calc(100vw - 40px));
      min-height: 172px;
      padding: 20px;
      flex-direction: column;
      justify-content: center;
      gap: 9px;
      border: 1px dashed rgba(243, 201, 130, .62);
      border-radius: 26px;
      background:
        radial-gradient(circle at 50% 0, rgba(214, 161, 93, .18), transparent 65%),
        rgba(31, 22, 16, .94);
      color: var(--cream);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .5), inset 0 1px rgba(255, 255, 255, .12);
      transform: none;
      filter: none;
      animation: cartDropAppear .22s cubic-bezier(.2,.8,.2,1) both;
    }

    .floating-cart.drag-active > span[aria-hidden="true"] {
      font-size: 32px;
      line-height: 1;
    }

    .floating-cart.drag-active > span:nth-of-type(3) {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: .16em;
    }

    .floating-cart.drag-active b {
      position: absolute;
      top: 14px;
      right: 15px;
      color: #21140b;
    }

    .floating-cart.drag-active .drop-hint {
      position: static;
      display: block;
      order: 3;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .09em;
      transform: none;
    }

    .floating-cart.drag-active.drop-target {
      border-style: solid;
      border-color: rgba(243, 201, 130, .95);
      background:
        radial-gradient(circle at 50% 0, rgba(214, 161, 93, .28), transparent 68%),
        rgba(48, 32, 19, .97);
      box-shadow: 0 0 0 5px rgba(214, 161, 93, .1), 0 28px 80px rgba(0, 0, 0, .56);
      transform: translateY(-4px) scale(1.02);
    }

    .floating-cart.drag-active.drop-target .drop-hint {
      color: var(--gold);
    }

    @keyframes cartDropAppear {
      from { opacity: .5; transform: translateY(12px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .floating-cart.cart-bump,
    .floating-cart.cart-success {
      animation: cartBump .42s ease;
    }

    .floating-cart.cart-bump b {
      animation: badgeBump .42s ease;
    }

    @keyframes cartBump {
      45% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes badgeBump {
      45% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    #hold-svg {
      position: absolute;
      inset: -8px;
      width: 68px;
      height: 68px;
      transform: rotate(-90deg);
      opacity: 0
    }

    #cursor.holding #hold-svg {
      opacity: 1
    }

    #cursor.dwell-complete .cursor-dot {
      background: var(--gold);
      box-shadow: 0 0 18px rgba(243, 201, 130, .9);
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 26px;
      transform: translate(-50%, -20px);
      opacity: 0;
      z-index: 10000;
      padding: 11px 17px;
      border: 1px solid var(--line2);
      border-radius: 15px;
      background: rgba(18, 14, 11, .92);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
      font-size: 12px;
      font-weight: 800;
      transition: .22s
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    .toast small {
      display: block;
      color: var(--muted);
      font-weight: 500;
      margin-top: 3px
    }

    #dev {
      position: fixed;
      left: 12px;
      bottom: 10px;
      z-index: 10001;
      display: none;
      gap: 5px;
      flex-wrap: wrap;
      max-width: 700px
    }

    #dev button {
      font-size: 10px;
      padding: 5px 8px;
      border-radius: 8px;
      background: #251b15;
      color: #e7c9a8;
      border: 1px solid #3b2b21
    }

    #gestureDebug {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 10002;
      max-width: min(760px, calc(100vw - 24px));
      padding: 9px 12px;
      border: 1px solid rgba(214, 161, 93, .4);
      border-radius: 12px;
      background: rgba(15, 11, 8, .92);
      color: var(--cream);
      font: 10px/1.5 ui-monospace, Consolas, monospace;
      pointer-events: none;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .68);
      backdrop-filter: blur(10px);
      z-index: 80;
      display: grid;
      place-items: center
    }

    .modal {
      width: min(520px, 90%);
      padding: 30px;
      border-radius: 28px;
      background: #17120f;
      border: 1px solid var(--line2);
      box-shadow: 0 30px 100px rgba(0, 0, 0, .6);
      text-align: center
    }

    .modal h3 {
      font-size: 25px
    }

    .modal p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 22px
    }

    .category-grid[style*="margin-top:12px"] {
      margin-top: 0 !important;
      gap: 10px !important
    }

    .category-grid[style*="margin-top:12px"] .category {
      min-height: 120px !important;
      padding: 12px !important
    }

    .category-grid[style*="margin-top:12px"]+div {
      margin-top: 8px !important
    }

    @media(max-height:780px) {
      .screen {
        padding-top: 18px;
        padding-bottom: 12px
      }

      .detail-screen:not(.menu-screen) {
        padding-top: 68px;
        padding-bottom: 12px;
      }

      .toolbar {
        margin-bottom: 12px
      }

      .detail-screen > .toolbar {
        margin-bottom: 8px;
      }

      .review-grid {
        height: auto;
        min-height: 0
      }

      .confirm-panel {
        padding: 16px
      }

      .hold-ring {
        width: 76px;
        height: 76px;
        margin-bottom: 10px
      }
    }

    @media(max-width:1050px) {
      .hero {
        grid-template-columns: 1fr
      }

      .hero-art {
        display: none
      }

      .category-grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .product-grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .cart-layout,
      .review-grid,
      .success {
        grid-template-columns: 1fr
      }

      .screen {
        padding: 24px
      }

      .detail-layout {
        grid-template-columns: minmax(0, .75fr) minmax(0, 1.25fr);
        gap: 18px;
      }

      .hero-copy {
        padding-left: 0
      }
    }

    @media(max-width:700px) {
      .kiosk-status {
        top: 10px;
        right: 10px;
        gap: 5px
      }

      .kiosk-status .status {
        height: 36px;
        padding: 0 9px;
        font-size: 9px
      }

      .floating-cart {
        top: 10px;
        left: 10px;
        min-height: 36px;
        padding: 0 10px;
        font-size: 10px
      }

      .screen.menu-screen {
        padding: 68px 18px 92px
      }

      .detail-screen:not(.menu-screen) {
        padding: 68px 14px 12px;
      }

      .detail-screen > .toolbar {
        margin-bottom: 8px;
      }

      .detail-layout {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .detail-art {
        flex: 0 0 118px;
      }

      .detail-photo {
        min-height: 0;
      }

      .detail-copy {
        flex: 1 1 auto;
        min-height: 0;
        padding-right: 8px;
      }

      .detail-footer > div:last-child {
        flex-basis: 100%;
      }

      .menu-tools {
        align-items: stretch;
        flex-direction: column
      }

      .search-wrap {
        max-width: none
      }
    }
  
    /* Real product photography */
    .product-visual { overflow:hidden; position:relative; background:#17120f; }
    .product-photo { width:100%; height:100%; display:block; object-fit:cover; aspect-ratio:1/1; transition:transform .45s ease, filter .3s ease; }
    .product:hover .product-photo { transform:scale(1.045); filter:saturate(1.06); }
    .product-visual .tag { z-index:2; }
    .detail-art { overflow:hidden; position:relative; }

              return !current || current.pid !== item.pid || current.qty !== item.qty ||
                current.size !== item.size || current.temp !== item.temp ||
                current.sugar !== item.sugar || current.milk !== item.milk ||
                current.add?.length !== item.add?.length ||
                current.add?.some((value, addIndex) => value !== item.add?.[addIndex]);
            });
            if (cartChanged) {
              state.cart = message.cart.map(item => ({ ...item, add: [...(item.add || [])] }));
              const nextCount = String(count());
              const countElement = $('#cartCount');
              if (countElement.textContent !== nextCount) countElement.textContent = nextCount;
            }
          }
        }
        if (message.type === 'cart_sync') {
          state.cart = message.cart || [];
          if (state.screen === 'cart' || state.screen === 'review') {
            render();
          } else {
            const nextCount = String(count());
            const countElement = $('#cartCount');
            if (countElement && countElement.textContent !== nextCount) countElement.textContent = nextCount;
            const menuCountElement = $('.menu-cart-btn b');
            if (menuCountElement && menuCountElement.textContent !== nextCount) menuCountElement.textContent = nextCount;
            const headerCartButton = $('.header-cart-btn');
            if (headerCartButton) headerCartButton.textContent = `🛒 Cart (${nextCount})`;
          }
        }
        if (message.type === 'order_created') {
          state.order = message.order;
          const orderId = String(message.order?.id || message.order?.order_id || '');
          if (orderId) soundManager.play('success', orderId);
          state.screen = 'confirm';
          render();
        }
        if (message.type === 'error') toast('System message', message.message || 'Unknown error');
      };
    }
    function handleGesture(gesture, handDetected = true, details = '', candidate = 'NONE') {
      const g = gesture || 'NONE';
      const isMouseActive = performance.now() - lastMouseTime < 3500;
      trackingActive = Boolean((handDetected && g !== 'FIST') || isMouseActive);
      lastGestureDetails = details;
      cursorElement.classList.toggle('inactive', !trackingActive);

      if (!handDetected) {
        if (!isMouseActive) {
          clearDragCandidate();
          if (interactionState === 'SCROLLING') {
            endGestureScroll();
          }
          if (isDragActive() && !dragLostTimer) {
            dragLostTimer = setTimeout(() => {
              dragLostTimer = null;
              if (isDragActive()) finishProductDrag(false);
            }, DRAG_LOST_TIMEOUT);
          }
          if (!dragState && interactionState !== 'SCROLLING') {
            if (!handLostDwellTimer && interactionState === 'DWELLING') {
              handLostDwellTimer = setTimeout(() => {
                handLostDwellTimer = null;
                if (!trackingActive) {
                  if (hoverTarget?.isConnected) hoverTarget.classList.remove('pinch-ready');
                  hoverTarget = null;
                  updateProductHoverSound(null);
                  $('#cursor').classList.remove('hover');
                  clearDwellSelection();
                  setInteractionState('IDLE');
                }
              }, 350);
            } else if (interactionState !== 'DWELLING') {
              if (hoverTarget?.isConnected) hoverTarget.classList.remove('pinch-ready');
              hoverTarget = null;
              updateProductHoverSound(null);
              $('#cursor').classList.remove('hover');
              clearDwellSelection();
              setInteractionState('IDLE');
            }
          }
        }
        lastGesture = g;
        updateGestureDebug(g, false);
        return;
      }
      clearTimeout(dragLostTimer);
      dragLostTimer = null;
      clearTimeout(handLostDwellTimer);
      handLostDwellTimer = null;
      if (['DROP_PROCESSING', 'CANCEL_PROCESSING', 'DROP_SUCCESS', 'CANCELLED'].includes(interactionState)) {
        lastGesture = g;
        updateGestureDebug(g, true);
        return;
      }

      if (isDragActive()) {
        if (g === 'FIST') {
          finishProductDrag(false);
          lastGesture = g;
          return;
        }
        if (g === 'PINCH') {
          clearTimeout(pendingPinchReleaseTimer);
          pendingPinchReleaseTimer = null;
          lastGesture = 'PINCH';
          return;
        }
        if (candidate === 'PINCH') {
          return;
        }
        if (!pendingPinchReleaseTimer) {
          pendingPinchReleaseTimer = setTimeout(() => {
            pendingPinchReleaseTimer = null;
            if (isDragActive()) {
              finishProductDrag(dragState.overCart);
            }
          }, 80);
        }
        lastGesture = g;
        return;
      }

      if (g === 'RELAX') {
        if (hoverTarget?.isConnected) hoverTarget.classList.remove('pinch-ready');
        hoverTarget = null;
        clearDwellSelection();
        clearDragCandidate();
        updateProductHoverSound(null);
        cursorElement.classList.remove('hover');
        cursorLabelElement.textContent = 'RELAX · HOLD PAUSED';
        if (interactionState === 'POINTING' || interactionState === 'DWELLING') {
          setInteractionState('IDLE');
        }
        lastGesture = g;
        updateGestureDebug(g, true);
        return;
      }

      if (g !== 'PINCH') clearDragCandidate();

      if (g === 'TWO_FINGER_SCROLL') {
        clearTimeout(scrollExitTimer);
        scrollExitTimer = null;
        if (interactionState !== 'SCROLLING') {
          if (hoverTarget) hoverTarget.classList.remove('pinch-ready');
          hoverTarget = null;
          updateProductHoverSound(null);
          clearDwellSelection();
          cursorElement.classList.remove('hover');
          beginGestureScroll();
          setInteractionState('SCROLLING');
        }
        cursorElement.classList.add('scrolling');
        cursorLabelElement.textContent = 'SCROLL MODE';
        lastGesture = g;
        updateGestureDebug(g, true);
        return;
      }

      if (interactionState === 'SCROLLING') {
        if (!scrollExitTimer) {
          scrollExitTimer = setTimeout(() => {
            scrollExitTimer = null;
            if (interactionState === 'SCROLLING' && lastGesture !== 'TWO_FINGER_SCROLL') {
              endGestureScroll();
            }
          }, 140);
        }
      }

      if (g === 'PINCH') {
        clearDwellSelection();
        if (hoverTarget) updateProductHoverSound(null);
        const target = getDragProductAtCursor();
        setDragCandidate(target);
        lastGesture = g;
        updateGestureDebug(g, true);
        return;
      }

      if (g === 'FIST') {
        if (hoverTarget?.isConnected) hoverTarget.classList.remove('pinch-ready');
        hoverTarget = null;
        clearDwellSelection();
        updateProductHoverSound(null);
        cursorElement.classList.remove('hover');
        setInteractionState('IDLE');
        if (g !== lastGesture) action('back');
        lastGesture = g;
        updateGestureDebug(g, true);
        return;
      }

      if (g === 'POINT') {
        clearTimeout(dwellGraceTimer);
        dwellGraceTimer = null;
        cursorElement.classList.remove('scrolling');
        lastGesture = g;
        updateGestureDebug(g, true);
        return;
      }

      if (g === 'NONE') {
        cursorElement.classList.remove('scrolling');
        lastGesture = g;
        updateGestureDebug(g, true);
        return;
      }

      cursorElement.classList.remove('scrolling');
      lastGesture = g;
      updateGestureDebug(g, true);
    }
    function getCursorScrollTarget() { let element = document.elementFromPoint(cursorPixelX, cursorPixelY); while (element && element !== document.body) { const style = getComputedStyle(element); if (/(auto|scroll)/.test(style.overflowY) && element.scrollHeight > element.clientHeight + 1) return element; element = element.parentElement; } return document.querySelector('#content .detail-copy') || document.querySelector('#content .screen') }
    function scrollScreen(direction) { const screen = getCursorScrollTarget(); if (!screen) return; const maxScroll = screen.scrollHeight - screen.clientHeight; if (maxScroll <= 1) return; screen.scrollBy({ top: direction * Math.max(180, screen.clientHeight * .65), behavior: 'smooth' }) }
    function navigateTargets(delta) { const targets = [...document.querySelectorAll('[data-action]')].filter(x => !x.disabled); if (!targets.length) return; state.selectedIndex = (state.selectedIndex + delta + targets.length) % targets.length; targets.forEach(x => x.classList.remove('active')); targets[state.selectedIndex].classList.add('active'); targets[state.selectedIndex].scrollIntoView({ block: 'nearest', inline: 'nearest' }); toast(delta > 0 ? '→ NEXT' : '← PREVIOUS') }
    window.addEventListener('mousemove', e => {
      lastMouseTime = performance.now();
      trackingActive = true;
      cursorElement.classList.remove('inactive');
      setCursorTarget((e.clientX - kioskRect.left) / kioskRect.width * 1280, (e.clientY - kioskRect.top) / kioskRect.height * 720);
      const target = e.target?.closest?.('[data-action], #floatingCart, input:not([disabled]), select:not([disabled]), textarea:not([disabled]), .detail-art[data-product-id], .product[data-product-id]');
      if (target) cursorHover(target, true);
      else if (hoverTarget) cursorHover(hoverTarget, false);
      else dwellTriggeredKey = null;
    });
    window.addEventListener('keydown', e => {
      if (e.ctrlKey && e.altKey && e.shiftKey && e.key.toLowerCase() === 'q') {
        e.preventDefault();
        fetch('/_shutdown', { method: 'POST' }).catch(error => {
          console.warn('[SmartCoffee] Could not request graceful shutdown:', error);
        });
        return;
      }
      if (e.key === 'ArrowRight') navigateTargets(1);
      else if (e.key === 'ArrowLeft') navigateTargets(-1);
      else if (e.key === 'Enter') { const t = document.querySelector('.active[data-action]'); if (t) t.click(); }
      else if (e.key.toLowerCase() === 'f') handleGesture('FIST');
      else if (e.key.toLowerCase() === 'c') action('go:cart');
      else if (e.key.toLowerCase() === 'r') action('reset');
    });
    $('#floatingCart').addEventListener('click', () => action('go:cart'));
    render(); connect(); pendingFrameHandle = requestAnimationFrame(animationLoop);
  </script>
